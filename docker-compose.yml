services:
  api:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      TRUSTPIN_HTTP_ADDR: ":8080"
      TRUSTPIN_DB_URL: "postgres://trustpin:trustpin@postgres:5432/trustpin?sslmode=disable"
      TRUSTPIN_REDIS_ADDR: "redis:6379"
      TRUSTPIN_CHALLENGE_TTL: "2m"
      TRUSTPIN_ENROLLMENT_TTL: "10m"
      TRUSTPIN_NONCE_TTL: "5m"
      TRUSTPIN_RATE_LIMIT_PER_MINUTE: "120"
      TRUSTPIN_ENABLE_TOTP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16
    # Container listens on 5432 for other containers (postgres:5432)
    # Host maps to 5433 to avoid conflict with local macOS PostgreSQL on 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustpin -d trustpin"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_DB: trustpin
      POSTGRES_USER: trustpin
      POSTGRES_PASSWORD: trustpin
    volumes:
      - trustpin_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port exposed; only internal access via redis:6379
volumes:
  trustpin_pg:
